name: Synthetic engine checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: cad-rule synthesize --dataset examples/synthetic_three_variants.json --output results/rule.json
      - run: cad-rule apply --model examples/synthetic_unseen_variant.json --rule results/rule.json
      - run: cad-rule legacy-index --root examples --output results/legacy_index.json
      - run: cad-rule legacy-search --root examples --query "parallel edge closed loop"
      - run: cad-rule legacy-promote --root examples --function-id 'public_legacy_demo.py::find_parallel_edge_on_closed_wire' --output-dir results/legacy_proposals
