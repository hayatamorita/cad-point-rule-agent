[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-point-rule-agent"
version = "0.1.0"
description = "Synthetic geometry predicate synthesis proof-of-concept for CAD point discovery"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CAD Point Rule Agent contributors"}]
dependencies = []

[project.scripts]
cad-rule = "cad_rule_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
